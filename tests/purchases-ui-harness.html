<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Purchases UI Harness</title><link rel="stylesheet" href="../style.css"></head>
<body><main id="goods-panel" class="panel active"></main>
<script>window.__app_initialized = true;</script>
<script type="module">
  import { state } from '../js/state.js';
  import { renderPurchasesPanel } from '../js/components/purchases.js?v=20261024-return-debt-display-v1';
  import { bomGateway } from '../js/services/bom.js?v=20261024-return-debt-display-v1';
  const role = new URLSearchParams(location.search).get('role') || 'admin';
  state.currentUser = { id: 'finance-test', username: 'finance-test', role };
  const materials = [{ id: 'shell-1', code: 'VO-NT01-THUNG', name: 'VỎ THÙNG NT01 · Sơn nội thất', purchase_unit: 'cái', is_active: true }];
  window.purchaseHarness = { calls: 0, fail: false };
  bomGateway.read = async filters => ({ rows: materials.filter(item => `${item.code} ${item.name}`.toLocaleLowerCase('vi').includes((filters.query || '').toLocaleLowerCase('vi'))), hasMore: false });
  bomGateway.addProductPackaging = async () => {
    window.purchaseHarness.calls++;
    if (window.purchaseHarness.fail) throw new Error('Cloud cần chạy migration 0101 để bổ sung vỏ theo mã sản phẩm.');
    if (materials.length > 1) return { created: 0 };
    materials.push({ id: 'shell-2', code: 'VO-NT02-LON', name: 'VỎ LON NT02 · Sơn ngoại thất', purchase_unit: 'cái', is_active: true });
    return { created: 1 };
  };
  state.suppliers = [{ id: 'sup-1', code: 'NCC-01', name: 'Nhà cung cấp A' }];
  state.purchases = [{
    id: 'pur-1', code: 'PM-0001', purchaseDate: '2026-08-01T08:00:00Z',
    invoiceNumber: 'INV-001', supplierId: 'sup-1', supplierCode: 'NCC-01',
    supplierName: 'Nhà cung cấp A', subtotalAmount: 250000, vatRate: 8, vatAmount: 20000,
    totalAmount: 270000, paidAmount: 100000,
    balanceDue: 170000, status: 'completed', items: []
  }];
  renderPurchasesPanel(document.getElementById('goods-panel'));
  document.body.dataset.ready = 'true';
</script></body></html>
